schema = 1
name = "Ham 2m CW"
name_uk = "Аматори 2 м CW"
slug = "ham-2m-cw"
family = "amateur-cw"
difficulty = "weekend"

[tune]
frequency_hz = 144_050_000
ppm = 0.0
raster_hz = 0

[window]
sample_rate_hz = 1_024_000
channel_bw_hz = 400

[strength]
gain = "manual"
gain_db = 40.2

[voice]
mode = "cw"
deviation_hz = 0
deemphasis_us = 0
squelch_db = -90.0
cw_pitch_hz = 700.0

[readout]
audio = true
morse = true

[detect]
mode = "hop"
band_start_hz = 144_000_000
band_end_hz = 144_100_000
raster_hz = 100
shape = "cw-needle"
identify = "none"

[coach]
summary = "Morse on 2 metres, bottom of the band. The detector looks for thin needles."
hints = [
  "Morse readout is on. A clean note can become letters.",
  "Fine-tune in 10 Hz steps. Activity is sporadic.",
]
caveats = ["Hand-keyed Morse may decode imperfectly."]

[coach.uk]
summary = "Морзе на 2 м, низ діапазону. Детектор шукає тонкі голки."
hints = [
  "Зчитування Морзе увімкнене. Чистий тон може стати літерами.",
  "Крок 10 Гц. Активність рідкісна.",
]
caveats = ["Ручне Морзе може декодуватися криво."]

[[bookmarks]]
name = "CW"
frequency_hz = 144_050_000
