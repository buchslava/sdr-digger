schema = 1
name = "Ham 2m SSB"
name_uk = "Аматори 2 м SSB"
slug = "ham-2m-ssb"
family = "amateur-ssb"
difficulty = "weekend"

[tune]
frequency_hz = 144_300_000
ppm = 0.0
raster_hz = 0

[window]
sample_rate_hz = 1_024_000
channel_bw_hz = 2_700

[strength]
gain = "manual"
gain_db = 40.2

[voice]
mode = "usb"
deviation_hz = 0
deemphasis_us = 0
squelch_db = -80.0
cw_pitch_hz = 700.0

[readout]
audio = true
morse = false

[detect]
mode = "hop"
band_start_hz = 144_150_000
band_end_hz = 144_400_000
raster_hz = 500
shape = "am"
identify = "none"

[coach]
summary = "Amateur USB on 2 metres. 144.300 MHz is the Region 1 calling frequency."
hints = [
  "Signals are weak and short. Open the squelch and tune in 50 Hz steps.",
  "This band is inside the RTL tuner, unlike 10 m SSB.",
]
caveats = ["Transmit only if licensed."]

[coach.uk]
summary = "Аматорський USB на 2 м. 144.300 МГц — виклик регіону 1."
hints = [
  "Сигнали слабкі й короткі. Відкрийте сквелч і крокуйте по 50 Гц.",
  "Цей діапазон усередині тюнера RTL, на відміну від SSB на 10 м.",
]
caveats = ["Передавати — лише з ліцензією."]

[[bookmarks]]
name = "calling"
frequency_hz = 144_300_000
