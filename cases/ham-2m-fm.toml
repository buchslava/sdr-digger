schema = 1
name = "Ham 2m FM"
name_uk = "Аматори 2 м FM"
slug = "ham-2m-fm"
family = "amateur-fm"
difficulty = "beginner"

[tune]
frequency_hz = 145_500_000
ppm = 0.0
raster_hz = 12_500

[window]
sample_rate_hz = 1_024_000
channel_bw_hz = 12_500

[strength]
gain = "manual"
gain_db = 36.4

[voice]
mode = "nbfm"
deviation_hz = 5_000
deemphasis_us = 0
squelch_db = -50.0
cw_pitch_hz = 700.0

[readout]
audio = true
morse = false

[detect]
mode = "hop"
band_start_hz = 144_000_000
band_end_hz = 146_000_000
raster_hz = 12_500
shape = "nbfm"
identify = "none"

[coach]
summary = "Amateur FM repeaters and simplex on 2 metres (144–146 MHz Region 1)."
hints = [
  "Scan the segment; quiet channels are normal.",
  "Listen only unless you hold a licence.",
]
caveats = ["Transmit only if licensed."]

[coach.uk]
summary = "Аматорське FM на 2 м (144–146 МГц, регіон 1)."
hints = [
  "Скануйте сегмент; тиша на каналах — норма.",
  "Лише прийом, якщо немає ліцензії.",
]
caveats = ["Передавати — лише з ліцензією."]
