schema = 1
name = "ISS voice"
name_uk = "МКС голос"
slug = "iss-voice"
family = "amateur-fm"
difficulty = "weekend"

[tune]
frequency_hz = 145_800_000
ppm = 0.0
raster_hz = 0

[window]
sample_rate_hz = 1_024_000
channel_bw_hz = 12_500

[strength]
gain = "manual"
gain_db = 40.2

[voice]
mode = "nbfm"
deviation_hz = 5_000
deemphasis_us = 0
squelch_db = -70.0
cw_pitch_hz = 700.0

[readout]
audio = true
morse = false

[detect]
mode = "poll"
shape = "nbfm"
identify = "none"

[coach]
summary = "The International Space Station often downlinks FM voice on 145.800 MHz."
hints = [
  "Only during a pass and when the crew is transmitting.",
  "Doppler: nudge ± a few kHz as the bird rises and sets.",
]
caveats = ["Passes are short. Empty scan is normal."]

[coach.uk]
summary = "МКС часто передає FM-голос на 145.800 МГц."
hints = [
  "Лише під час прольоту і коли екіпаж у ефірі.",
  "Доплер: підкрутіть ± кілька кГц під час сходу/заходу.",
]
caveats = ["Прольоти короткі. Порожній скан — норма."]

[[bookmarks]]
name = "ISS FM"
frequency_hz = 145_800_000
