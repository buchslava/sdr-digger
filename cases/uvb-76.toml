schema = 1
name = "UVB-76 The Buzzer"
name_uk = "UVB-76 Жужжалка"
slug = "uvb-76"
family = "lab"
difficulty = "weekend"

[tune]
frequency_hz = 4_625_000
ppm = 0.0
raster_hz = 0

[window]
sample_rate_hz = 1_024_000
channel_bw_hz = 2_700

[strength]
gain = "manual"
gain_db = 40.2

[voice]
mode = "usb"
deviation_hz = 0
deemphasis_us = 0
squelch_db = -80.0
cw_pitch_hz = 700.0

[readout]
